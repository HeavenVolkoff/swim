# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: CI

"on":
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'tests/**'
      - 'test_fixtures/**'
      - 'scripts/**'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/ci.yml'
      - '.gitattributes'
      - '!**/*.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code == 'true' || github.event_name != 'pull_request' }}
    steps:
      - name: Check modified paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'tests/**'
              - 'test_fixtures/**'
              - 'scripts/**'
              - 'build.zig'
              - 'build.zig.zon'
              - '.github/workflows/ci.yml'
              - '.gitattributes'
              - '!**/*.md'

  quality:
    name: Code Quality & Formatting
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Verify source formatting
        run: zig build check-fmt

      - name: Verify compilation without emitting binaries
        run: zig build check

      - name: Run linter and static analysis
        run: zig build lint

  unit-tests:
    name: Unit Tests (${{ matrix.name }})
    needs:
      - changes
      - quality
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-26.04
            platform: linux-x64
            arch: x64
          - name: Linux ARM64
            os: ubuntu-26.04-arm
            platform: linux-arm64
            arch: arm64
          - name: macOS 26 ARM64
            os: macos-26
            platform: macos-arm64
            arch: arm64
          - name: macOS 26 x64
            os: macos-26-intel
            platform: macos-x64
            arch: x64
          - name: Windows Server x64
            os: windows-2025
            platform: windows-x64
            arch: x64
          - name: Windows 11 ARM64
            os: windows-11-arm
            platform: windows-arm64
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Run unit test suite
        run: zig build test --summary all

      - name: Build swim executable
        run: zig build -Doptimize=ReleaseSmall

      - name: Execute primary E2E tests for ${{ matrix.arch }}
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\e2e-test.ps1 -SwimPath .\zig-out\bin\swim.exe -TargetArch ${{ matrix.arch }}

      - name: Execute 32-bit x86 MSI test (Windows Server x64 only)
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: powershell
        run: |
          .\scripts\e2e-test.ps1 -SwimPath .\zig-out\bin\swim.exe -TargetArch x86

      - name: Execute incompatible architecture rejection test (arm64 package on x64 runner)
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: powershell
        run: |
          .\scripts\e2e-test.ps1 -SwimPath .\zig-out\bin\swim.exe `
            -TargetArch arm64 -IncompatibleTest

      - name: Execute x64 emulation MSI test (Windows 11 ARM64 only)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: powershell
        run: |
          .\scripts\e2e-test.ps1 -SwimPath .\zig-out\bin\swim.exe -TargetArch x64

      - name: Build deterministic test package (Unix)
        if: runner.os != 'Windows'
        run: |
          ./zig-out/bin/swim -n DeterminismApp test_fixtures/mock.exe \
            -t 1700000000 -o deterministic.msi
          shasum -a 256 deterministic.msi | cut -d ' ' -f 1 > hash-${{ matrix.platform }}.txt

      - name: Build deterministic test package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\zig-out\bin\swim.exe -n DeterminismApp test_fixtures\mock.exe `
            -t 1700000000 -o deterministic.msi
          (Get-FileHash -Path deterministic.msi -Algorithm SHA256).Hash.ToLower() |
            Out-File -FilePath hash-${{ matrix.platform }}.txt -NoNewline -Encoding ascii

      - name: Upload hash artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-hash-${{ matrix.platform }}
          path: hash-${{ matrix.platform }}.txt
          retention-days: 1

  cross-compile:
    name: Cross-Compilation Validation
    needs:
      - changes
      - quality
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Compile for all supported targets
        run: |
          set -euo pipefail
          targets=(
            x86_64-linux-musl
            aarch64-linux-musl
            x86_64-macos-none
            aarch64-macos-none
            x86_64-windows-gnu
            aarch64-windows-gnu
            x86-windows-gnu
          )
          for target in "${targets[@]}"; do
            echo "::group::Compiling for $target"
            zig build -Dtarget="$target" -Doptimize=ReleaseSmall
            ls -la zig-out/bin/
            echo "::endgroup::"
          done

  determinism-verify:
    name: Compare Deterministic Hashes
    needs:
      - changes
      - unit-tests
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all hash artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Assert byte-for-byte identity across OSes
        run: |
          hashes=(msi-hash-*/hash-*.txt)
          first=$(cat "${hashes[0]}" | tr -d '[:space:]')
          echo "Baseline hash (${hashes[0]}): $first"

          for f in "${hashes[@]}"; do
            h=$(cat "$f" | tr -d '[:space:]')
            echo "Checking $f: $h"
            if [ "$h" != "$first" ]; then
              echo "::error::Determinism failure! $f differs from baseline ($h != $first)"
              exit 1
            fi
          done
          echo "Deterministic verification passed: identical MSI generated across all OSes."

  ci:
    name: CI
    needs:
      - changes
      - quality
      - unit-tests
      - cross-compile
      - determinism-verify
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.unit-tests.result }}
          CROSS_RESULT: ${{ needs.cross-compile.result }}
          DETERMINISM_RESULT: ${{ needs.determinism-verify.result }}
        run: |
          set -euo pipefail
          echo "Changes detection result: $CHANGES_RESULT (code: $CHANGES_CODE)"
          echo "Quality check result: $QUALITY_RESULT"
          echo "Unit tests result: $TESTS_RESULT"
          echo "Cross-compile result: $CROSS_RESULT"
          echo "Determinism verify result: $DETERMINISM_RESULT"

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Changes detection job failed or was cancelled."
            exit 1
          fi

          if [ "$CHANGES_CODE" = "true" ]; then
            failed=0
            for job in "Quality:$QUALITY_RESULT" \
                       "UnitTests:$TESTS_RESULT" \
                       "CrossCompile:$CROSS_RESULT" \
                       "Determinism:$DETERMINISM_RESULT"; do
              name="${job%%:*}"
              res="${job##*:}"
              if [ "$res" != "success" ]; then
                echo "::error::$name check did not succeed (status: $res)"
                failed=1
              fi
            done
            if [ "$failed" -ne 0 ]; then
              exit 1
            fi
            echo "All CI checks completed successfully for code changes."
          else
            echo "No code changes detected; CI checks bypassed successfully."
          fi
